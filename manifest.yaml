# ============================================================================
# rvocs-main manifest (human-readable full-stack index)
#
# Authority rules:
#   1) The authoritative pin of each sub-repo is that repo's own gitlink /
#      manifest.yaml. This file only mirrors them for review; it never influences
#      build behaviour.
#   2) Machine-readable parameters live in config/ (defaults.sh + repos.sh).
#   3) Published artifacts (docker tags / .deb names) live in RELEASES.list,
#      grouped by target and host architecture with comment separators, and
#      are the single source of truth for --list-releases / --download.
#   4) AMD framework component pins/versions live in rvocs-hcs-amd
#      (config/sources.sh + manifest.yaml framework_versions); they are read,
#      never copied.
# ============================================================================
version: 1

project:
  name: rvocs-main
  version: v1.0.1
  baseline: rvocs-2026.10
  purpose: >-
    Orchestration layer for RVOCs (RISC-V Open Computing System): one CLI to manage
    host dependencies, device-stack image builds and deployment. Sources of the
    sub-repos are never copied and no submodules are used - this repository only
    does discovery, argument translation and stage chaining.
  branches:
    main: single branch; riscv64 / x86_64 differences are handled by
      --arch plus each sub-repo's patches/<arch> overlays
  repos_policy: >-
    Only this repository is required from a user's point of view. Vendor
    repositories are fetched explicitly with ./rvocs.sh --clone into the sibling
    directory; no action clones them implicitly (upstream/ sources are fetched
    by each vendor repo's own fetch stage).
  docs:
    overview: README.md
    quickstart: docs/QUICKSTART.md
    cli: docs/CLI.md
    repos: docs/REPOS.md
    architecture: docs/ARCHITECTURE.md
    quirks: docs/QUIRKS.md
    releases: RELEASES.list
    amd_components: ../rvocs-hcs-amd/manifest.yaml (framework_versions)

targets:
  tt-host:
    role: host dependencies (kernel driver + tools + hugepages + udev)
    url: https://github.com/RVOCs-org/rvocs-hcs-tenstorrent.git   # the host part of the Tenstorrent vendor repository
    dirs: [rvocs-hcs-tenstorrent]
    part: host
    env_override: RVOCS_TENSTORRENT_DIR
    clone_branch: main
    entry: host/scripts/build.sh
    branch: main              # every repository is single-branch; arch differences live in patches/{common,riscv64,x86_64}
    actions: [install, build, download, version, doctor, list-releases, clone]
    artifact_patterns:
      - host/dist/rvocs-tt-deps_<version>_<debarch>.tar.zst
      - host/dist/rvocs-tt-deps_<version>_<debarch>.deb
    note: interacts with the image repos only through /dev/tenstorrent; tt-kmd 2.11.x is compatible with the tt-umd shipped in the images

  tt-stack:
    role: TT-Metal + vLLM inference image (device Tenstorrent cards)
    url: https://github.com/RVOCs-org/rvocs-hcs-tenstorrent.git
    dirs: [rvocs-hcs-tenstorrent]
    part: stack
    env_override: RVOCS_TENSTORRENT_DIR
    clone_branch: main
    entry: stack/scripts/build.sh
    branch: main              # single-branch; the riscv64 porting layer lives in stack/patches/riscv64/
    actions: [build, download, version, doctor, list-releases, clone]
    stages: [fetch, workdir, base, image, verify]
    artifact_patterns:
      - rvocs-vllm-tt-<arch>:<version>       # e.g. rvocs-vllm-tt-riscv64:v0.1.0
      - local/tt-metal/tt-metalium/ubuntu-26.04-riscv64:v1 (base image, not distributed)
    note: one vendor repository with tt-host - host/ builds the host packages, stack/ the image

  therock:
    role: ROCm/TheRock + torch/triton/vLLM inference image (device AMD GPUs)
    url: https://github.com/RVOCs-org/rvocs-hcs-amd.git
    dirs: [rvocs-hcs-amd]
    env_override: RVOCS_THEROCK_DIR
    clone_branch: main
    entry: scripts/build.sh
    branch: main              # single-branch; the riscv64 porting layer lives in patches/riscv64/
    actions: [build, download, version, doctor, list-releases, clone]
    stages: [preflight, fetch, workdir, build, wheels, image, verify]
    artifact_patterns:
      - rvocs-vllm-therock<rocm major.minor>-<gpu>-<arch>:<version>    # e.g. rvocs-vllm-therock10.0-r9700-riscv64:v0.1.0
      - rvocs-runtime-therock<rocm major.minor>-<gpu>-<arch>:<version>
    note: x86_64 defaults to prebuilt + pip (minutes); riscv64 is source-only (~23 hours)

images:
  # Naming rule shared by all targets (concrete tags are listed in RELEASES.list):
  #   rvocs-vllm-tt-<arch>:<version>                            tt-stack
  #   rvocs-vllm-therock<rocm major.minor>-<gpu>-<arch>:<version> therock
  # <arch> is the OCI name: amd64 / riscv64
  registry: swr.cn-east-3.myhuaweicloud.com/cloud-mdgx
  tt-stack:
    pattern: rvocs-vllm-tt-<arch>:<version>
    version_source: ../rvocs-hcs-tenstorrent/VERSION
  therock:
    pattern: rvocs-vllm-therock<rocm major.minor>-<gpu>-<arch>:<version>
    runtime_pattern: rvocs-runtime-therock<rocm major.minor>-<gpu>-<arch>:<version>
    default_gpu: r9700
    rocm_version: 10.0.0
    version_source: ../rvocs-hcs-amd/VERSION

# Container start defaults for the internal deploy helper (--deploy is not
# exposed yet).
deploy:
  tt-stack:
    model: Qwen3-8B
    tt_device: n300
    port: 8000
    devices: [/dev/tenstorrent, /dev/hugepages-1G]
  therock:
    model: Qwen3.5-9B
    models_dir: /models
    container_name: rvocs-vllm
    devices: [/dev/kfd, /dev/dri]

known_limits: |
  - rvocs-main does not build across architectures: the target arch must match the host.
  - Tenstorrent end-to-end inference has not been validated on real cards yet (acceptance
    stops at importing ttnn/vllm); the tt-kmd/firmware steps of tt-host on riscv64 are beta.
  - riscv64 omits torchvision / numba / opencv-python-headless / qwen-vl-utils / av by design.
